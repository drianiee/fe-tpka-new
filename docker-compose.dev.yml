services:
  fe:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        ENV_FILE: .env.dev
    image: fe-tpka:dev
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env.dev
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
    networks:
      - tpka_shared_dev

networks:
  tpka_shared_dev:
    external: true
