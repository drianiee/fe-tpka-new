services:
  fe:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: fe-tpka:dev
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./:/app
      - fe_node_modules:/app/node_modules
      - fe_next:/app/.next
    env_file:
      - .env.dev
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm ci; fi && npm run dev -- -H 0.0.0.0 -p 3000"
    restart: unless-stopped
    networks:
      - tpka_shared_dev

volumes:
  fe_node_modules:
  fe_next:

networks:
  tpka_shared_dev:
    external: true
