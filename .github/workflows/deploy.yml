name: FE Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
  pull_request:
    branches:
      - main
      - master
      - dev
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read

jobs:
  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_PUBLIC_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-dev:
    name: Deploy Dev
    needs: validate
    if: |
      (github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'develop')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy Dev via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_TARGET_DIR_DEV }}"
            git fetch --all --prune
            git pull --rebase origin dev || git pull --rebase origin develop
            docker compose -f docker-compose.dev.yml build
            docker compose -f docker-compose.dev.yml up -d --remove-orphans
            docker compose -f docker-compose.dev.yml ps
            docker compose -f docker-compose.dev.yml logs --tail=50
            docker image prune -f
            docker builder prune -f

  deploy-prod:
    name: Deploy Prod
    needs: validate
    if: |
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy Prod via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_TARGET_DIR_PROD }}"
            git fetch --all --prune
            git pull --rebase origin main || git pull --rebase origin master
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=50
            docker image prune -f
            docker builder prune -f
