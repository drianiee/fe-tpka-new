name: FE Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read

jobs:
  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_BACKEND_PUBLIC_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-dev:
    name: Deploy Dev
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref_name == 'dev') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev')
    runs-on:
      - self-hosted
      - linux
      - tpka
      - tpka-fe
    timeout-minutes: 30
    steps:
      - name: Deploy Dev on VPS
        env:
          DEPLOY_TARGET_DIR_DEV: ${{ secrets.DEPLOY_TARGET_DIR_DEV }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_TARGET_DIR_DEV"
          git fetch --all --prune
          git pull --rebase origin dev
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.dev.yml up -d --remove-orphans
          docker compose -f docker-compose.dev.yml ps
          docker compose -f docker-compose.dev.yml logs --tail=50
          docker image prune -f
          docker builder prune -f

  deploy-prod:
    name: Deploy Prod
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod')
    runs-on:
      - self-hosted
      - linux
      - tpka
      - tpka-fe
    timeout-minutes: 30
    steps:
      - name: Deploy Prod on VPS
        env:
          DEPLOY_TARGET_DIR_PROD: ${{ secrets.DEPLOY_TARGET_DIR_PROD }}
        run: |
          set -euo pipefail
          cd "$DEPLOY_TARGET_DIR_PROD"
          git fetch --all --prune
          git pull --rebase origin main
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=50
          docker image prune -f
          docker builder prune -f
