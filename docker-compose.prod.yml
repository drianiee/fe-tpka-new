services:
  fe:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: fe-tpka:prod
    ports:
      - "127.0.0.1:${FE_PORT:-3000}:3000"
    env_file:
      - .env.prod
    restart: unless-stopped
    networks:
      - tpka_shared_prod

networks:
  tpka_shared_prod:
    external: true
